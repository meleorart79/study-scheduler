timezone: Europe/Paris

sourceFeed:
  # Exactly one of `file` or `url` must be set.
  #
  # file: read a local .ics you exported/downloaded once (e.g. a whole
  # semester at a time). No live updates -- you re-export and drop in a
  # fresh file (or POST /admin/regenerate) whenever your timetable changes.
  file: "./data/school-schedule.ics"
  # url: fetch a live feed over HTTP on every regeneration instead.
  # url: "https://example.edu/timetable/my-calendar.ics"
  fetchTimeoutSeconds: 15
  maxResponseBytes: 5000000

studyWindows:
  weekdays:
    - start: "08:30"
      end: "11:45"
    - start: "12:30"
      end: "22:00"

  weekends:
    - start: "08:00"
      end: "12:00"
    - start: "16:00"
      end: "22:00"

grid:
  blockMinutes: 15
  sessionMinutes: 90
  minBufferMinutes: 15

reviews:
  - name: near
    targetOffsetDays: 1
    flexibilityDays: 1
  - name: far
    # First-fit: take the first free slot anywhere in the horizon instead
    # of aiming for a target offset/flexibility window.
    anySlot: true

workload:
  preferredDailyMinutes: 180
  maxDailyMinutes: null
  classLoadAdjustment:
    enabled: true
    # Was 30/30 -- with unweighted class hours, a normal school day could
    # crush effective capacity to near zero, which pushed reviews out to
    # the edges of their flexibility window (or beyond, via pull-forward).
    # Now paired with classWeighting below (TD/TP count for less), so a
    # smaller reduction-per-hour plus a higher floor keeps some room open
    # on most days instead of forcing everything outward.
    minutesReducedPerClassHour: 20
    floorMinutes: 60
  # A day that already has a study session on it is treated as this many
  # days "closer" to a review's target date than an empty day, so sessions
  # cluster together during busy school weeks instead of each one spreading
  # out independently. Set to 0 to disable clustering preference.
  compactionBonusDays: 1

# Weights class time by type before it's fed into classLoadAdjustment above.
# Matched case-insensitively against "{summary} {location}" from the source
# ICS event; first matching rule wins. TD/TP sessions are typically shorter
# and more frequent than CM lectures, so they count for less "load" here --
# tune the weights down further (e.g. 0.25) if weeks still feel too packed.
classWeighting:
  defaultWeight: 1.0
  rules:
    - pattern: "\\bTD\\b"
      weight: 0.5
    - pattern: "\\bTP\\b"
      weight: 0.5

# Class-type-aware review counts, keyed off a "(CM)"/"(TD)"/"(TP)" tag in
# the class title. Untagged classes (or explicitly "(CM)") behave exactly
# like before -- every configured review (near + far). A "(TD)" class gets
# only the near review. "(TP)" classes of the same subject (title with the
# tag stripped) are paired off chronologically -- the second class of each
# pair gets the near review; a trailing unpaired TP class gets its own near
# review right away instead of waiting for a partner.
classTypeReviews:
  enabled: true
  pattern: "\\((CM|TD|TP)\\)"
  cmReviewNames: null
  tdReviewNames: ["near"]
  tpPairReviewNames: ["near"]

assessments:
  file: "./schedule.js"
  protectedTypes: ["partiel"]

# Optional statically configured blocked periods (travel, family
# commitments, etc). Empty by default. Example:
# blockedPeriods:
#   - startUtc: "2026-10-20T00:00:00.000Z"
#     endUtc: "2026-10-22T00:00:00.000Z"
#     reason: "Away for a wedding"
blockedPeriods: []

# Weekly recurring blocked windows (standing commitments like sports).
# Expanded into concrete blocked periods across the active scheduling
# horizon on every regeneration -- no need to add one entry per week.
recurringBlockedPeriods:
  # bufferMinutes keeps study sessions from being placed immediately
  # before/after basketball with zero gap. It only affects scheduling --
  # the calendar event itself still shows the real 12:00-13:30 / 17:00-18:30
  # time, not the padded window.
  - weekday: "monday"
    start: "12:00"
    end: "13:30"
    reason: "Basketball"
    bufferMinutes: 30
  - weekday: "wednesday"
    start: "17:00"
    end: "18:30"
    reason: "Basketball"
    bufferMinutes: 30
  - weekday: "friday"
    start: "17:00"
    end: "18:30"
    reason: "Basketball"
    bufferMinutes: 30

examProtection:
  scope: all-subjects
  blackoutDays: 7
  pullForwardMaxDays: 6
  # Once a candidate date is within this many days of an upcoming partiel
  # blackout, ranking starts penalizing it so sessions get placed earlier
  # instead of piling up right at the blackout's edge as the week fills up.
  approachPenaltyDays: 5
  approachPenaltyWeight: 2

# If you're loading a whole semester at once via sourceFeed.file, make sure
# lookaheadDays covers the rest of the semester from "today" (e.g. a 16-week
# semester starting now needs ~112+ days) so nothing near the end gets
# filtered out of the parse window.
horizon:
  lookaheadDays: 120
  lookbackDays: 21

regeneration:
  cronTime: "05:00"
  cronTimezone: Europe/Paris
