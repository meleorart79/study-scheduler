timezone: Europe/Paris

sourceFeed:
  # Exactly one of `file` or `url` must be set.
  #
  # file: read a local .ics you exported/downloaded once (e.g. a whole
  # semester at a time). No live updates -- you re-export and drop in a
  # fresh file (or POST /admin/regenerate) whenever your timetable changes.
  file: "./data/school-schedule.ics"
  # url: fetch a live feed over HTTP on every regeneration instead.
  # url: "https://example.edu/timetable/my-calendar.ics"
  fetchTimeoutSeconds: 15
  maxResponseBytes: 5000000

studyWindows:
  weekdays:
    - start: "11:30"
      end: "21:00"

  weekends:
    - start: "10:00"
      end: "14:00"
    - start: "20:00"
      end: "22:00"

grid:
  blockMinutes: 15
  sessionMinutes: 90
  minBufferMinutes: 15

reviews:
  - name: near
    targetOffsetDays: 1
    flexibilityDays: 1
  - name: far
    targetOffsetDays: 7
    flexibilityDays: 3

workload:
  preferredDailyMinutes: 180
  maxDailyMinutes: 270
  classLoadAdjustment:
    enabled: true
    minutesReducedPerClassHour: 30
    floorMinutes: 30

assessments:
  file: "./schedule.js"
  protectedTypes: ["partiel"]

# Optional statically configured blocked periods (travel, family
# commitments, etc). Empty by default. Example:
# blockedPeriods:
#   - startUtc: "2026-10-20T00:00:00.000Z"
#     endUtc: "2026-10-22T00:00:00.000Z"
#     reason: "Away for a wedding"
blockedPeriods: []

examProtection:
  scope: all-subjects
  blackoutDays: 7
  pullForwardMaxDays: 6

# If you're loading a whole semester at once via sourceFeed.file, make sure
# lookaheadDays covers the rest of the semester from "today" (e.g. a 16-week
# semester starting now needs ~112+ days) so nothing near the end gets
# filtered out of the parse window.
horizon:
  lookaheadDays: 60
  lookbackDays: 14

regeneration:
  cronTime: "05:00"
  cronTimezone: Europe/Paris
