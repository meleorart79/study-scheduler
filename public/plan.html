<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>study-scheduler — planning</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #161920;
            --border: #2a2e38;
            --text: #e6e8ec;
            --muted: #8b93a3;
            --accent: #5b8dee;
            --accent-dim: #2b3a5e;
            --good: #4caf7d;
            --warn: #e0a63a;
            --bad: #e0605a;
            --hour: 40px
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            position: sticky;
            top: 0;
            z-index: 10;
            flex-wrap: wrap
        }

            header h1 {
                font-size: 16px;
                margin: 0;
                font-weight: 600
            }

            header .spacer {
                flex: 1
            }

            header input[type=password] {
                background: var(--bg);
                border: 1px solid var(--border);
                color: var(--text);
                padding: 6px 10px;
                border-radius: 6px;
                width: 220px
            }

        button {
            background: var(--accent-dim);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px
        }

            button:hover {
                border-color: var(--accent)
            }

            button.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff
            }

        main {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto
        }

            main.wide {
                max-width: 1200px
            }

        .toolbar {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 16px
        }

            .toolbar label {
                display: flex;
                align-items: center;
                gap: 5px;
                color: var(--muted);
                font-size: 13px
            }

        .seg {
            display: inline-flex;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden
        }

            .seg button {
                border: none;
                border-radius: 0;
                background: transparent;
                color: var(--muted)
            }

                .seg button.active {
                    background: var(--accent-dim);
                    color: var(--text)
                }

        .nav {
            display: flex;
            gap: 6px;
            align-items: center
        }

            .nav .range {
                min-width: 190px;
                text-align: center;
                font-weight: 500
            }

        .status {
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 14px;
            font-size: 13px
        }

            .status.ok {
                background: #14261c;
                color: var(--good);
                border: 1px solid #1f3d2c
            }

            .status.err {
                background: #2a1717;
                color: var(--bad);
                border: 1px solid #3d1f1f
            }

        .day {
            margin-bottom: 22px
        }

            .day h2 {
                font-size: 13px;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: .04em;
                border-bottom: 1px solid var(--border);
                padding-bottom: 6px;
                margin: 0 0 8px;
                display: flex;
                justify-content: space-between
            }

                .day h2 .today-tag {
                    color: var(--accent)
                }

        .session {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 6px
        }

            .session .time {
                font-variant-numeric: tabular-nums;
                color: var(--muted);
                width: 92px;
                flex-shrink: 0;
                font-size: 13px
            }

            .session .title {
                flex: 1
            }

                .session .title .subject {
                    font-weight: 500
                }

                .session .title .review {
                    color: var(--muted);
                    font-size: 12.5px;
                    margin-left: 6px
                }

        .swatch {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle
        }

        .badge {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            flex-shrink: 0
        }

            .badge.SCHEDULED {
                background: #14261c;
                color: var(--good)
            }

            .badge.LOCKED {
                background: #1f2438;
                color: var(--accent)
            }

            .badge.NEEDS_ATTENTION {
                background: #2a1717;
                color: var(--bad)
            }

            .badge.SKIPPED, .badge.CANCELLED {
                background: #26251a;
                color: var(--warn)
            }

        .empty {
            color: var(--muted);
            text-align: center;
            padding: 40px 0
        }

        .muted {
            color: var(--muted)
        }

        /* ---- week view ---- */
        .cal {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: auto
        }

        .wk-head, .wk-body {
            display: grid;
            grid-template-columns: 48px repeat(7,minmax(110px,1fr));
            min-width: 860px
        }

        .wk-head {
            position: sticky;
            top: 0;
            z-index: 3;
            background: var(--panel);
            border-bottom: 1px solid var(--border)
        }

            .wk-head div {
                padding: 8px 6px;
                text-align: center;
                font-size: 12.5px;
                color: var(--muted);
                border-left: 1px solid var(--border)
            }

                .wk-head div:first-child {
                    border-left: none
                }

            .wk-head .dnum {
                display: block;
                font-size: 16px;
                color: var(--text);
                font-weight: 600
            }

            .wk-head .istoday .dnum {
                color: var(--accent)
            }

        .gutter {
            position: relative
        }

            .gutter span {
                position: absolute;
                right: 6px;
                transform: translateY(-50%);
                font-size: 11px;
                color: var(--muted);
                font-variant-numeric: tabular-nums
            }

        .col {
            position: relative;
            border-left: 1px solid var(--border);
            background-image: repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),var(--border) calc(var(--hour) - 1px),var(--border) var(--hour))
        }

            .col.istoday {
                background-color: #12161f
            }

            .col.weekend {
                background-color: #13151b
            }

        .ev {
            position: absolute;
            left: 3px;
            right: 3px;
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 11.5px;
            line-height: 1.25;
            overflow: hidden;
            border-left: 3px solid;
            background: var(--c-bg);
            border-color: var(--c);
            cursor: default
        }

            .ev b {
                display: block;
                font-weight: 600;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis
            }

            .ev small {
                color: var(--muted);
                font-size: 11px
            }

            .ev.LOCKED {
                outline: 1px dashed var(--c);
                outline-offset: -2px
            }

        .nowline {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--bad);
            z-index: 2;
            pointer-events: none
        }

            .nowline::before {
                content: "";
                position: absolute;
                left: -4px;
                top: -3px;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--bad)
            }

        /* ---- month view ---- */
        .mo-head, .mo-grid {
            display: grid;
            grid-template-columns: repeat(7,minmax(0,1fr))
        }

            .mo-head div {
                padding: 8px 6px;
                font-size: 12px;
                color: var(--muted);
                text-align: center;
                border-bottom: 1px solid var(--border)
            }

        .mo-cell {
            min-height: 104px;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 4px;
            cursor: pointer;
            min-width: 0
        }

            .mo-cell:nth-child(7n) {
                border-right: none
            }

            .mo-cell:hover {
                background: #191d27
            }

            .mo-cell.other {
                opacity: .45
            }

            .mo-cell.istoday .dn {
                background: var(--accent);
                color: #fff
            }

        .dn {
            display: inline-block;
            min-width: 22px;
            text-align: center;
            border-radius: 11px;
            font-size: 12px;
            padding: 1px 5px;
            margin-bottom: 3px;
            color: var(--muted)
        }

        .chip {
            display: block;
            font-size: 11px;
            padding: 2px 5px;
            margin-bottom: 2px;
            border-radius: 4px;
            border-left: 3px solid var(--c);
            background: var(--c-bg);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

            .chip.LOCKED {
                outline: 1px dashed var(--c);
                outline-offset: -1px
            }

        .more {
            font-size: 11px;
            color: var(--muted);
            padding-left: 4px
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            margin: 12px 0 0;
            font-size: 12px;
            color: var(--muted)
        }

        .unplaced {
            margin-top: 24px
        }

        @media(max-width:640px) {
            main {
                padding: 12px
            }

            .mo-cell {
                min-height: 72px
            }

            .chip {
                font-size: 10px
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" style="color:var(--accent);text-decoration:none;font-size:13px;">← Admin</a>
        <h1>Planning</h1>
        <div class="spacer"></div>
        <label style="color:var(--muted);font-size:13px;"><input type="checkbox" id="fScheduled" checked> Scheduled/Locked</label>
        <label style="color:var(--muted);font-size:13px;"><input type="checkbox" id="fAttention" checked> Needs attention</label>
        <label style="color:var(--muted);font-size:13px;"><input type="checkbox" id="fOther"> Skipped/Cancelled</label>
        <input id="tokenInput" type="password" placeholder="STUDY_ADMIN_TOKEN">
        <button id="saveTokenBtn">Connect</button>
        <button id="reloadBtn">Reload</button>
    </header>
    <main id="main">
        <div id="status"></div>
        <div class="toolbar">
            <div class="seg" id="viewSeg">
                <button data-v="week">Week</button><button data-v="month">Month</button><button data-v="list">List</button>
            </div>
            <div class="nav" id="calNav">
                <button id="prevBtn" aria-label="Previous">‹</button>
                <span class="range" id="rangeLabel"></span>
                <button id="nextBtn" aria-label="Next">›</button>
                <button id="todayBtn">Today</button>
            </div>
            <div id="listOpts" class="toolbar" style="margin:0">
                <label><input type="radio" name="range" value="all" checked> All upcoming</label>
                <label><input type="radio" name="range" value="7"> Next 7 days</label>
                <label><input type="radio" name="range" value="30"> Next 30 days</label>
                <label><input type="checkbox" id="fPast"> Include past</label>
            </div>
        </div>
        <div id="agenda"></div>
        <div id="legend" class="legend"></div>
        <div id="unplaced" class="unplaced"></div>
    </main>
    <script>
// @ts-nocheck
(function () {
  const HOUR0 = 8, HOUR1 = 24; // visible grid: 08:00–24:00
  const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  function token() { return localStorage.getItem("sa_token") || ""; }
  function setToken(t) { localStorage.setItem("sa_token", t); }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function showStatus(msg, ok) {
    const el = document.getElementById("status");
    el.className = "status " + (ok ? "ok" : "err"); el.textContent = msg; el.style.display = "block";
    if (ok) setTimeout(() => { if (el.textContent === msg) el.style.display = "none"; }, 3000);
  }
  async function api(path) {
    const res = await fetch(path, { headers: { "Authorization": "Bearer " + token() } });
    let data = null; try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((data && data.error) || (res.status + " " + res.statusText));
    return data;
  }

  // ---- state ----
  let allSessions = [];
  let view = localStorage.getItem("sa_plan_view") || "week";
  let anchor = new Date();

  // ---- date helpers (local time) ----
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  const mondayOf = d => addDays(startOfDay(d), -((d.getDay() + 6) % 7));
  const fmtTime = d => d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });

  // ---- subject colours: same subject => same hue, regardless of CM/TD/TP tag ----
  function subjectOf(s) { return String(s.sourceSummary || "").replace(/\s*\((CM|TD|TP)\)\s*/i, " ").trim(); }
  const hueCache = {};
  function hueFor(subject) {
    if (hueCache[subject] === undefined) {
      let h = 0; for (const ch of subject) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      hueCache[subject] = (h * 47) % 360;
    }
    return hueCache[subject];
  }
  function colorStyle(s) {
    const h = hueFor(subjectOf(s));
    return `--c:hsl(${h} 65% 62%);--c-bg:hsl(${h} 45% 20%)`;
  }
  const lockMark = s => s.status === "LOCKED" ? "🔒 " : "";

  // ---- filters ----
  function statusAllowed(status) {
    if ((status === "SCHEDULED" || status === "LOCKED") && document.getElementById("fScheduled").checked) return true;
    if (status === "NEEDS_ATTENTION" && document.getElementById("fAttention").checked) return true;
    if ((status === "SKIPPED" || status === "CANCELLED") && document.getElementById("fOther").checked) return true;
    return false;
  }
  const filtered = () => allSessions.filter(s => statusAllowed(s.status));
  const byStart = (a, b) => { const x = a.startUtc || "9999", y = b.startUtc || "9999"; return x < y ? -1 : x > y ? 1 : 0; };

  // ---- load ----
  async function load() {
    try {
      allSessions = await api("/admin/sessions");
      render();
      showStatus("Loaded " + allSessions.length + " sessions.", true);
    } catch (e) { showStatus("Failed to load: " + e.message, false); }
  }

  // ---- events ----
  document.getElementById("saveTokenBtn").addEventListener("click", () => { setToken(document.getElementById("tokenInput").value.trim()); load(); });
  document.getElementById("reloadBtn").addEventListener("click", load);
  ["fScheduled","fAttention","fOther","fPast"].forEach(id => document.getElementById(id).addEventListener("change", render));
  document.querySelectorAll("input[name=range]").forEach(r => r.addEventListener("change", render));
  document.querySelectorAll("#viewSeg button").forEach(b => b.addEventListener("click", () => setView(b.dataset.v)));
  document.getElementById("prevBtn").addEventListener("click", () => step(-1));
  document.getElementById("nextBtn").addEventListener("click", () => step(1));
  document.getElementById("todayBtn").addEventListener("click", () => { anchor = new Date(); render(); });
  function setView(v) { view = v; localStorage.setItem("sa_plan_view", v); render(); }
  function step(dir) {
    if (view === "week") anchor = addDays(anchor, 7 * dir);
    else { anchor = new Date(anchor.getFullYear(), anchor.getMonth() + dir, 1); }
    render();
  }

  // ---- render dispatcher ----
  function render() {
    document.querySelectorAll("#viewSeg button").forEach(b => b.classList.toggle("active", b.dataset.v === view));
    document.getElementById("calNav").style.display = view === "list" ? "none" : "flex";
    document.getElementById("listOpts").style.display = view === "list" ? "flex" : "none";
    document.getElementById("main").classList.toggle("wide", view !== "list");
    const agenda = document.getElementById("agenda");
    agenda.innerHTML = "";
    document.getElementById("legend").innerHTML = "";
    document.getElementById("unplaced").innerHTML = "";
    if (view === "list") return renderList(agenda);
    if (view === "week") renderWeek(agenda); else renderMonth(agenda);
    renderLegend();
    renderUnplaced();
  }

  // ---- legend + unplaced (calendar views) ----
  function renderLegend() {
    const subjects = [...new Set(filtered().filter(s => s.startUtc).map(subjectOf))].sort();
    document.getElementById("legend").innerHTML = subjects.map(sub =>
      `<span><span class="swatch" style="background:hsl(${hueFor(sub)} 65% 62%)"></span>${esc(sub)}</span>`).join("")
      + (filtered().some(s => s.status === "LOCKED") ? '<span>🔒 locked</span>' : "");
  }
  function renderUnplaced() {
    const list = filtered().filter(s => !s.startUtc).sort(byStart);
    if (!list.length) return;
    const box = document.getElementById("unplaced");
    box.innerHTML = '<div class="day"><h2><span>Not currently placed</span></h2></div>';
    const wrap = box.firstChild;
    list.forEach(s => {
      const row = document.createElement("div"); row.className = "session";
      row.innerHTML = `<div class="time">&mdash;</div>
        <div class="title"><span class="swatch" style="background:hsl(${hueFor(subjectOf(s))} 65% 62%)"></span><span class="subject">${esc(s.sourceSummary)}</span><span class="review">${esc(s.reviewName)}</span>${s.needsAttentionReason ? `<div class="muted" style="font-size:12px;margin-top:2px;">${esc(s.needsAttentionReason)}</div>` : ""}</div>
        <span class="badge ${s.status}">${esc(s.status)}</span>`;
      wrap.appendChild(row);
    });
  }

  // ---- week view ----
  function renderWeek(agenda) {
    const mon = mondayOf(anchor), sun = addDays(mon, 6), today = new Date();
    document.getElementById("rangeLabel").textContent =
      mon.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + " – " + sun.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
    const hoursPx = (HOUR1 - HOUR0) * 40;
    const placed = filtered().filter(s => s.startUtc && s.endUtc);

    let head = '<div></div>' + days.map((d, i) =>
      `<div class="${sameDay(d, today) ? "istoday" : ""}">${DAYS[i]}<span class="dnum">${d.getDate()}</span></div>`).join("");
    let gut = ""; for (let h = HOUR0; h <= HOUR1; h++) gut += `<span style="top:${(h - HOUR0) * 40}px">${String(h % 24).padStart(2, "0")}:00</span>`;

    const cols = days.map((d, i) => {
      const evs = placed.filter(s => sameDay(new Date(s.startUtc), d)).map(s => {
        const a = new Date(s.startUtc), b = new Date(s.endUtc);
        const startMin = a.getHours() * 60 + a.getMinutes(), endMin = Math.min(b.getHours() * 60 + b.getMinutes() || 1440, 1440);
        const top = Math.max(0, (startMin - HOUR0 * 60) / 60 * 40), h = Math.max(18, (endMin - startMin) / 60 * 40 - 2);
        return `<div class="ev ${s.status}" style="${colorStyle(s)};top:${top}px;height:${h}px" title="${esc(s.sourceSummary)} · ${esc(s.reviewName)} · ${fmtTime(a)}–${fmtTime(b)} · ${s.status}">
          <b>${lockMark(s)}${esc(subjectOf(s))}</b><small>${fmtTime(a)}–${fmtTime(b)} · ${esc(s.reviewName)}</small></div>`;
      }).join("");
      let now = "";
      if (sameDay(d, today)) {
        const m = today.getHours() * 60 + today.getMinutes();
        if (m >= HOUR0 * 60) now = `<div class="nowline" style="top:${(m - HOUR0 * 60) / 60 * 40}px"></div>`;
      }
      return `<div class="col ${sameDay(d, today) ? "istoday" : ""} ${i >= 5 ? "weekend" : ""}" style="height:${hoursPx}px">${evs}${now}</div>`;
    }).join("");

    agenda.innerHTML = `<div class="cal"><div class="wk-head">${head}</div>
      <div class="wk-body"><div class="gutter" style="height:${hoursPx}px">${gut}</div>${cols}</div></div>`;
    // scroll to ~now (or morning) on first draw
    const cal = agenda.querySelector(".cal");
    cal.style.maxHeight = "calc(100vh - 220px)";
    const m = today.getHours() * 60;
    cal.scrollTop = Math.max(0, (Math.max(m, HOUR0 * 60) - HOUR0 * 60) / 60 * 40 - 80);
  }

  // ---- month view ----
  function renderMonth(agenda) {
    const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1), today = new Date();
    document.getElementById("rangeLabel").textContent = first.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    const gridStart = mondayOf(first);
    const placed = filtered().filter(s => s.startUtc).sort(byStart);
    let cells = "";
    for (let i = 0; i < 42; i++) {
      const d = addDays(gridStart, i);
      if (i >= 35 && d.getMonth() !== first.getMonth()) break; // skip a fully-empty 6th row
      const evs = placed.filter(s => sameDay(new Date(s.startUtc), d));
      const shown = evs.slice(0, 3).map(s =>
        `<span class="chip ${s.status}" style="${colorStyle(s)}" title="${esc(s.sourceSummary)} · ${esc(s.reviewName)} · ${s.status}">${lockMark(s)}${fmtTime(new Date(s.startUtc))} ${esc(subjectOf(s))}</span>`).join("");
      const more = evs.length > 3 ? `<div class="more">+${evs.length - 3} more</div>` : "";
      cells += `<div class="mo-cell ${d.getMonth() !== first.getMonth() ? "other" : ""} ${sameDay(d, today) ? "istoday" : ""}" data-date="${d.toISOString()}">
        <span class="dn">${d.getDate()}</span>${shown}${more}</div>`;
    }
    agenda.innerHTML = `<div class="cal"><div class="mo-head">${DAYS.map(n => `<div>${n}</div>`).join("")}</div><div class="mo-grid">${cells}</div></div>`;
    agenda.querySelectorAll(".mo-cell").forEach(c => c.addEventListener("click", () => { anchor = new Date(c.dataset.date); setView("week"); }));
  }

  // ---- list view (unchanged behaviour) ----
  function renderList(agenda) {
    const includePast = document.getElementById("fPast").checked;
    const rangeSel = document.querySelector("input[name=range]:checked").value;
    const now = new Date();
    const horizonEnd = rangeSel !== "all" ? new Date(now.getTime() + Number(rangeSel) * 86400000) : null;
    const items = filtered().filter(s => {
      if (!s.startUtc) return true;
      const d = new Date(s.startUtc);
      if (!includePast && d < now && s.status !== "NEEDS_ATTENTION") return false;
      if (horizonEnd && d > horizonEnd) return false;
      return true;
    }).sort(byStart);
    if (!items.length) { agenda.innerHTML = '<div class="empty">Nothing matches the current filters.</div>'; return; }
    const unplaced = items.filter(s => !s.startUtc), placed = items.filter(s => s.startUtc);
    let lastKey = null, dayDiv = null; const todayKey = now.toDateString();
    placed.forEach(s => {
      const d = new Date(s.startUtc), key = d.toDateString();
      if (key !== lastKey) {
        lastKey = key; dayDiv = document.createElement("div"); dayDiv.className = "day";
        const h = document.createElement("h2");
        h.innerHTML = `<span>${esc(d.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" }))}</span>` + (key === todayKey ? '<span class="today-tag">Today</span>' : "");
        dayDiv.appendChild(h); agenda.appendChild(dayDiv);
      }
      const row = document.createElement("div"); row.className = "session";
      const end = s.endUtc ? fmtTime(new Date(s.endUtc)) : "";
      row.innerHTML = `<div class="time">${esc(fmtTime(d))}${end ? "–" + esc(end) : ""}</div>
        <div class="title"><span class="swatch" style="background:hsl(${hueFor(subjectOf(s))} 65% 62%)"></span><span class="subject">${lockMark(s)}${esc(s.sourceSummary)}</span><span class="review">${esc(s.reviewName)}</span></div>
        <span class="badge ${s.status}">${esc(s.status)}</span>`;
      dayDiv.appendChild(row);
    });
    if (unplaced.length) {
      const d2 = document.createElement("div"); d2.className = "day";
      d2.innerHTML = '<h2><span>Not currently placed</span></h2>';
      unplaced.forEach(s => {
        const row = document.createElement("div"); row.className = "session";
        row.innerHTML = `<div class="time">&mdash;</div>
          <div class="title"><span class="subject">${esc(s.sourceSummary)}</span><span class="review">${esc(s.reviewName)}</span>${s.needsAttentionReason ? `<div class="muted" style="font-size:12px;margin-top:2px;">${esc(s.needsAttentionReason)}</div>` : ""}</div>
          <span class="badge ${s.status}">${esc(s.status)}</span>`;
        d2.appendChild(row);
      });
      agenda.appendChild(d2);
    }
  }

  // refresh the "now" line every minute
  setInterval(() => { if (view === "week") render(); }, 60000);

  document.getElementById("tokenInput").value = token();
  render();
  if (token()) load(); else showStatus("Enter your STUDY_ADMIN_TOKEN above and click Connect.", false);
})();
    </script>
</body>
</html>
